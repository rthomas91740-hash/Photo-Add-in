<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Wolf Photo Capture</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      text-align: center;
    }
    h2 { color: #222; }
    #cameraBtn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 16px 24px;
      font-size: 18px;
      border-radius: 8px;
      width: 100%;
      max-width: 320px;
    }
    #preview {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }
    #status {
      margin-top: 16px;
      font-size: 15px;
      color: #444;
    }
    #uploadBtn {
      margin-top: 14px;
      background: #34a853;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 8px;
      display: none;
      width: 100%;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <h2>Take a Photo</h2>

  <!-- This input opens the phone's real camera when tapped -->
  <input type="file" accept="image/*" capture="environment" id="fileInput" style="display:none">
  <button id="cameraBtn">📷 Take Photo</button>

  <img id="preview" alt="preview">
  <button id="uploadBtn">Upload to Geotab</button>
  <div id="status"></div>

  <script>
    // ---- These get filled in automatically by Geotab Drive when it loads this add-in ----
    var geotabApi = null;   // the api object Drive gives us
    var geotabState = null;

    // ---- A fixed ID that identifies THIS add-in's data in Geotab. ----
    // Generate your own at: https://geotab.github.io/sdk/software/api/runner.html#sample:generate-addin-guid
    // Replace the placeholder below with the one you generate.
    var SOLUTION_ID = "aZmY0NmZkYWItOGYzZC1hNj"; // <-- REPLACE THIS

    var selectedFile = null;

    var fileInput = document.getElementById('fileInput');
    var cameraBtn = document.getElementById('cameraBtn');
    var preview = document.getElementById('preview');
    var uploadBtn = document.getElementById('uploadBtn');
    var statusEl = document.getElementById('status');

    cameraBtn.addEventListener('click', function () {
      fileInput.click();
    });

    fileInput.addEventListener('change', function (e) {
      if (!e.target.files || !e.target.files[0]) return;
      selectedFile = e.target.files[0];

      var reader = new FileReader();
      reader.onload = function (evt) {
        preview.src = evt.target.result;
        preview.style.display = 'block';
        uploadBtn.style.display = 'inline-block';
        statusEl.textContent = 'Ready to upload.';
      };
      reader.readAsDataURL(selectedFile);
    });

    uploadBtn.addEventListener('click', function () {
      if (!selectedFile) return;
      if (!geotabApi) {
        statusEl.textContent = 'Not connected to Geotab yet — open this from inside Drive.';
        return;
      }
      uploadPhoto(selectedFile);
    });

    function uploadPhoto(file) {
      statusEl.textContent = 'Creating record...';

      var fileName = 'photo-' + Date.now() + '.jpg';

      var mediaFileEntity = {
        name: fileName,
        solutionId: SOLUTION_ID,
        fromDate: new Date().toISOString(),
        toDate: new Date().toISOString()
        // You can also attach: device: { id: geotabState.deviceId }
        // or driver: { id: geotabState.userId } if those are available in state
      };

      // STEP 1: create the MediaFile record (metadata only, no image yet)
      geotabApi.call('Add', {
        typeName: 'MediaFile',
        entity: mediaFileEntity
      }, function (mediaFileId) {
        statusEl.textContent = 'Uploading image...';
        uploadBinary(mediaFileId, fileName, file);
      }, function (err) {
        statusEl.textContent = 'Error creating record: ' + err;
      });
    }

    function uploadBinary(mediaFileId, fileName, file) {
      // STEP 2: upload the actual image bytes for that record.
      // UploadMediaFile expects multipart/form-data, so we build the request by hand.
      var reader = new FileReader();
      reader.onload = function () {
        var arrayBuffer = reader.result;

        geotabApi.call('UploadMediaFile', {
          mediaFile: { id: mediaFileId, name: fileName },
          fileData: arrayBufferToBase64(arrayBuffer)
        }, function () {
          statusEl.textContent = '✅ Photo uploaded! It will appear in MyGeotab shortly.';
          uploadBtn.style.display = 'none';
        }, function (err) {
          statusEl.textContent = 'Upload failed: ' + err;
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function arrayBufferToBase64(buffer) {
      var binary = '';
      var bytes = new Uint8Array(buffer);
      for (var i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    // ---- Geotab Add-In lifecycle (required by every Geotab/Drive add-in) ----
    geotab.addin.fleetWolfPhotoCapture = function () {
      return {
        initialize: function (api, state, callback) {
          geotabApi = api;
          geotabState = state;
          callback();
        },
        focus: function (api, state) {},
        blur: function () {}
      };
    };
  </script>
</body>
</html>
