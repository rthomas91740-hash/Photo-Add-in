<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Photos</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      text-align: center;
    }
    h2 { color: #222; margin-bottom: 16px; }
    #jobNumber {
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    #cameraBtn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 16px 24px;
      font-size: 18px;
      border-radius: 8px;
      width: 100%;
      max-width: 320px;
    }
    #cameraBtn:disabled {
      background: #aac3ec;
    }
    #preview {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }
    #status {
      margin-top: 16px;
      font-size: 15px;
      color: #444;
    }
    #uploadBtn {
      margin-top: 14px;
      background: #34a853;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 8px;
      display: none;
      width: 100%;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <h2>New Job Photo</h2>

  <input type="text" id="jobNumber" placeholder="Job # / Work Order #">
  <select id="photoType" style="width:100%;max-width:320px;box-sizing:border-box;padding:14px;font-size:16px;border:1px solid #ccc;border-radius:8px;margin-bottom:14px;">
    <option value="BOL">BOL</option>
    <option value="Receipt">Receipt</option>
    <option value="Other">Other</option>
  </select>

  <!-- Fallback file input, used only when Drive's native camera API isn't available
       (e.g. testing this page in a regular desktop browser). -->
  <input type="file" accept="image/*" capture="environment" id="fileInput" style="display:none">
  <button id="cameraBtn">📷 Take Photo</button>

  <img id="preview" alt="preview">
  <button id="uploadBtn">Upload to Geotab</button>
  <div id="status"></div>

  <script>
    var SOLUTION_ID = "aZmY0NmZkYWItOGYzZC1hNj";

    var geotabApi = null;
    var geotabState = null;
    var sessionInfo = null;
    var selectedBlob = null;
    var deviceId = null;
    var driverId = null;

    function main() {
      var jobNumberEl = document.getElementById('jobNumber');
      var fileInput = document.getElementById('fileInput');
      var cameraBtn = document.getElementById('cameraBtn');
      var preview = document.getElementById('preview');
      var uploadBtn = document.getElementById('uploadBtn');
      var statusEl = document.getElementById('status');

      cameraBtn.addEventListener('click', function () {
        if (!jobNumberEl.value.trim()) {
          statusEl.textContent = 'Enter a Job # before taking a photo.';
          jobNumberEl.focus();
          return;
        }

        if (geotabApi && geotabApi.mobile && geotabApi.mobile.exists && geotabApi.mobile.exists()) {
          // Native Drive camera — opens Drive's own capture modal
          // (New Picture / Upload options) and hands us the image back
          // as base64 data. More reliable inside Drive's webview than
          // a plain HTML file input.
          statusEl.textContent = 'Opening camera...';
          geotabApi.mobile.camera.takePicture().then(function (base64Data) {
            selectedBlob = base64ToBlob(base64Data);
            showPreview(selectedBlob);
          }).catch(function (err) {
            statusEl.textContent = 'Camera error: ' + err;
          });
        } else {
          // Fallback for testing in a regular browser (no native Drive camera available)
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', function (e) {
        if (!e.target.files || !e.target.files[0]) return;
        selectedBlob = e.target.files[0];
        showPreview(selectedBlob);
      });

      function showPreview(blob) {
        var reader = new FileReader();
        reader.onload = function (evt) {
          preview.src = evt.target.result;
          preview.style.display = 'block';
          uploadBtn.style.display = 'inline-block';
          statusEl.textContent = 'Ready to upload.';
        };
        reader.readAsDataURL(blob);
      }

      uploadBtn.addEventListener('click', function () {
        if (!selectedBlob) return;
        if (!jobNumberEl.value.trim()) {
          statusEl.textContent = 'Enter a Job # before uploading.';
          jobNumberEl.focus();
          return;
        }
        if (!geotabApi) {
          statusEl.textContent = 'Not connected to Geotab yet — open this from inside Drive.';
          return;
        }
        statusEl.textContent = 'Creating record...';
        uploadPhoto(selectedBlob, jobNumberEl.value.trim(), document.getElementById('photoType').value, statusEl, uploadBtn);
      });
    }

    function base64ToBlob(base64Data) {
      // Handle both a raw base64 string and a data: URL, just in case.
      var raw = base64Data.indexOf(',') !== -1 ? base64Data.split(',')[1] : base64Data;
      var binary = atob(raw);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new Blob([bytes], { type: 'image/jpeg' });
    }

    function resolveVehicleAndDriver() {
      // Prefer Drive's native mobile API — official, documented methods
      // for the current vehicle/driver, instead of digging through the
      // raw state object.
      if (geotabApi && geotabApi.mobile && geotabApi.mobile.exists && geotabApi.mobile.exists()) {
        if (geotabApi.mobile.vehicle && geotabApi.mobile.vehicle.get) {
          geotabApi.mobile.vehicle.get().then(function (vehicle) {
            if (vehicle && vehicle.id) deviceId = vehicle.id;
          }).catch(function () {});
        }
        if (geotabApi.mobile.user && geotabApi.mobile.user.get) {
          geotabApi.mobile.user.get().then(function (user) {
            if (user && user.id) driverId = user.id;
          }).catch(function () {});
        }
      }

      // Also try the username-lookup fallback in parallel (not just when
      // the native mobile API is unavailable) — if the native user.get()
      // call fails silently or returns an unexpected shape, this still
      // gets us a driver ID. Guarded so it won't stomp on a value the
      // native call already set.
      if (geotabState) {
        if (!deviceId && geotabState.device && geotabState.device.id) {
          deviceId = geotabState.device.id;
        }
        if (geotabState.iam) {
          var usernames = Object.keys(geotabState.iam);
          if (usernames.length && geotabApi) {
            geotabApi.call('Get', {
              typeName: 'User',
              search: { name: usernames[0] }
            }, function (users) {
              if (!driverId && users && users[0]) driverId = users[0].id;
            }, function () {});
          }
        }
      }
    }

    function fetchSession(onReady) {
      geotabApi.getSession(function (session) {
        sessionInfo = {
          database: session.database,
          sessionId: session.sessionId,
          userName: session.userName,
          server: session.server || session.path || window.location.hostname
        };
        if (onReady) onReady();
      });
    }

    function uploadPhoto(blob, jobNumber, photoType, statusEl, uploadBtn) {
      // Job # and Type are both encoded into the filename so they're
      // always retrievable from a plain MediaFile Get call.
      var safeJob = jobNumber.replace(/[^a-z0-9\-_]/gi, '_');
      var fileName = 'job-' + safeJob + '-type-' + photoType + '-' + Date.now() + '.jpg';

      var entity = {
        name: fileName,
        solutionId: SOLUTION_ID,
        fromDate: new Date().toISOString(),
        toDate: new Date().toISOString()
      };
      if (deviceId) entity.device = { id: deviceId };
      if (driverId) entity.driver = { id: driverId };

      geotabApi.call('Add', {
        typeName: 'MediaFile',
        entity: entity
      }, function (mediaFileId) {
        statusEl.textContent = 'Uploading image...';
        doMultipartUpload(mediaFileId, fileName, blob, statusEl, uploadBtn);
      }, function (err) {
        statusEl.textContent = 'Error creating record: ' + err;
      });
    }

    function doMultipartUpload(mediaFileId, fileName, blob, statusEl, uploadBtn) {
      function send() {
        var payload = {
          method: 'UploadMediaFile',
          params: {
            mediaFile: { id: mediaFileId, name: fileName },
            credentials: {
              database: sessionInfo.database,
              sessionId: sessionInfo.sessionId,
              userName: sessionInfo.userName
            }
          }
        };

        var formData = new FormData();
        formData.append('JSON-RPC', JSON.stringify(payload));
        formData.append('file', blob, fileName);

        fetch('https://' + sessionInfo.server + '/apiv1/', {
          method: 'POST',
          body: formData
        })
          .then(function (res) { return res.json(); })
          .then(function (json) {
            if (json && json.error) {
              statusEl.textContent = 'Upload failed: ' + json.error.message;
              return;
            }
            statusEl.textContent = '✅ Photo uploaded! It will appear in MyGeotab shortly.';
            uploadBtn.style.display = 'none';
          })
          .catch(function (err) {
            statusEl.textContent = 'Upload failed: ' + err;
          });
      }

      if (sessionInfo) {
        send();
      } else {
        fetchSession(send);
      }
    }

    geotab.addin.fleetWolfPhotoCapture = function () {
      return {
        initialize: function (api, state, callback) {
          geotabApi = api;
          geotabState = state;

          callback();
          main();
          fetchSession();
          resolveVehicleAndDriver();
        },
        focus: function (api, state) {},
        blur: function () {}
      };
    };
  </script>
</body>
</html>
