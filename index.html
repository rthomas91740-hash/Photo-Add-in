<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Wolf Photo Capture</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      text-align: center;
    }
    h2 { color: #222; }
    #cameraBtn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 16px 24px;
      font-size: 18px;
      border-radius: 8px;
      width: 100%;
      max-width: 320px;
    }
    #preview {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }
    #status {
      margin-top: 16px;
      font-size: 15px;
      color: #444;
    }
    #uploadBtn {
      margin-top: 14px;
      background: #34a853;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 8px;
      display: none;
      width: 100%;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <h2>Take a Photo</h2>

  <input type="file" accept="image/*" capture="environment" id="fileInput" style="display:none">
  <button id="cameraBtn">📷 Take Photo</button>

  <img id="preview" alt="preview">
  <button id="uploadBtn">Upload to Geotab</button>
  <div id="status"></div>
  <div id="debugState" style="font-size:10px;color:#999;margin-top:24px;word-break:break-all;padding:0 10px;"></div>

  <script>
    // ---- Fixed solution ID for this add-in (permanent — generate once, reuse forever) ----
    var SOLUTION_ID = "aZmY0NmZkYWItOGYzZC1hNj";

    // ---- Populated once Drive calls initialize() ----
    var geotabApi = null;
    var geotabState = null;
    var sessionInfo = null; // { database, sessionId, userName, server }
    var selectedFile = null;

    // NOTE: Nothing in this top-level <script> block touches the DOM.
    // Drive evaluates this script before the add-in's body markup is attached,
    // so any getElementById() call up here returns null and throws —
    // which is exactly what caused the "cannot be installed" error.
    // All DOM lookups and event listeners are wired up inside main(),
    // which only runs once initialize() fires (markup is guaranteed present by then).

    function main() {
      var fileInput = document.getElementById('fileInput');
      var cameraBtn = document.getElementById('cameraBtn');
      var preview = document.getElementById('preview');
      var uploadBtn = document.getElementById('uploadBtn');
      var statusEl = document.getElementById('status');

      cameraBtn.addEventListener('click', function () {
        fileInput.click();
      });

      fileInput.addEventListener('change', function (e) {
        if (!e.target.files || !e.target.files[0]) return;
        selectedFile = e.target.files[0];

        var reader = new FileReader();
        reader.onload = function (evt) {
          preview.src = evt.target.result;
          preview.style.display = 'block';
          uploadBtn.style.display = 'inline-block';
          statusEl.textContent = 'Ready to upload.';
        };
        reader.readAsDataURL(selectedFile);
      });

      uploadBtn.addEventListener('click', function () {
        if (!selectedFile) return;
        if (!geotabApi) {
          statusEl.textContent = 'Not connected to Geotab yet — open this from inside Drive.';
          return;
        }
        statusEl.textContent = 'Creating record...';
        uploadPhoto(selectedFile, statusEl, uploadBtn);
      });
    }

    function fetchSession(onReady) {
      geotabApi.getSession(function (session) {
        sessionInfo = {
          database: session.database,
          sessionId: session.sessionId,
          userName: session.userName,
          server: session.server || session.path || window.location.hostname
        };
        if (onReady) onReady();
      });
    }

    function uploadPhoto(file, statusEl, uploadBtn) {
      var fileName = 'photo-' + Date.now() + '.jpg';

      // Link to the active vehicle/driver from Drive's state when available,
      // so the photo shows up against the right device/driver in MyGeotab
      // instead of floating with NoDeviceId / UnknownDriverId.
      var entity = {
        name: fileName,
        solutionId: SOLUTION_ID,
        fromDate: new Date().toISOString(),
        toDate: new Date().toISOString()
      };
      if (geotabState && geotabState.deviceId) {
        entity.device = { id: geotabState.deviceId };
      }
      if (geotabState && geotabState.driverId) {
        entity.driver = { id: geotabState.driverId };
      }

      geotabApi.call('Add', {
        typeName: 'MediaFile',
        entity: entity
      }, function (mediaFileId) {
        statusEl.textContent = 'Uploading image...';
        doMultipartUpload(mediaFileId, fileName, file, statusEl, uploadBtn);
      }, function (err) {
        statusEl.textContent = 'Error creating record: ' + err;
      });
    }

    function doMultipartUpload(mediaFileId, fileName, file, statusEl, uploadBtn) {
      function send() {
        var payload = {
          method: 'UploadMediaFile',
          params: {
            mediaFile: { id: mediaFileId, name: fileName },
            credentials: {
              database: sessionInfo.database,
              sessionId: sessionInfo.sessionId,
              userName: sessionInfo.userName
            }
          }
        };

        var formData = new FormData();
        formData.append('JSON-RPC', JSON.stringify(payload));
        formData.append('file', file, fileName);

        fetch('https://' + sessionInfo.server + '/apiv1/', {
          method: 'POST',
          body: formData
        })
          .then(function (res) { return res.json(); })
          .then(function (json) {
            if (json && json.error) {
              statusEl.textContent = 'Upload failed: ' + json.error.message;
              return;
            }
            statusEl.textContent = '✅ Photo uploaded! It will appear in MyGeotab shortly.';
            uploadBtn.style.display = 'none';
          })
          .catch(function (err) {
            statusEl.textContent = 'Upload failed: ' + err;
          });
      }

      if (sessionInfo) {
        send();
      } else {
        fetchSession(send);
      }
    }

    // ---- Geotab Add-In lifecycle ----
    geotab.addin.fleetWolfPhotoCapture = function () {
      return {
        initialize: function (api, state, callback) {
          geotabApi = api;
          geotabState = state;

          var debugEl = document.getElementById('debugState');
          if (debugEl) {
            try {
              debugEl.textContent = 'DEBUG state: ' + JSON.stringify(state);
            } catch (e) {
              debugEl.textContent = 'DEBUG state: (could not stringify) ' + String(state);
            }
          }

          // Complete the install immediately — don't make Drive wait on
          // network calls (getSession) before it'll let the add-in load.
          callback();

          // DOM is guaranteed present now that Drive has called initialize().
          main();

          // Fetch session credentials in the background so they're ready
          // by the time the driver taps "Upload to Geotab".
          fetchSession();
        },
        focus: function (api, state) {},
        blur: function () {}
      };
    };
  </script>
</body>
</html>
