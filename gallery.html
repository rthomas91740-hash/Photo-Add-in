<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Job Records</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #fafafa;
      color: #222;
    }
    h2 { margin-top: 0; }
    #toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    #toolbar button, #toolbar input {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    #printBtn {
      background: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
    }
    #refreshBtn {
      background: #eee;
      cursor: pointer;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 14px 18px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    th {
      background: #f0f0f0;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.03em;
      color: #555;
    }
    tbody tr:nth-child(even) { background: #fafafa; }
    tbody tr:hover { background: #f0f6ff; }
    td:first-child, th:first-child { width: 36px; text-align: center; padding-right: 0; }
    td:last-child, th:last-child { width: 80px; }
    .view-link {
      color: #1a73e8;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-size: 14px;
      padding: 0;
    }
    #status { color: #666; margin-bottom: 16px; }

    #printArea { display: none; }
    @media print {
      #toolbar, table { display: none !important; }
      #printArea { display: block !important; }
      .printCard {
        page-break-inside: avoid;
        margin-bottom: 24px;
        border-bottom: 1px solid #999;
        padding-bottom: 16px;
      }
      .printCard .stampRow { font-size: 13px; margin-top: 8px; }
    }
  </style>
</head>
<body style="font-family:-apple-system,Arial,sans-serif;margin:0;padding:20px;background:#fafafa;color:#222;">

  <h2 style="margin-top:0;">Job Records</h2>
  <div id="toolbar" style="display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap;">
    <button id="refreshBtn" style="padding:10px 16px;font-size:14px;border-radius:6px;border:1px solid #ccc;background:#eee;cursor:pointer;">Refresh</button>
    <input type="date" id="dateFilter" style="padding:10px 16px;font-size:14px;border-radius:6px;border:1px solid #ccc;">
    <input type="text" id="jobFilter" placeholder="Filter by Job #" style="padding:10px 16px;font-size:14px;border-radius:6px;border:1px solid #ccc;">
    <select id="typeFilter" style="padding:10px 16px;font-size:14px;border-radius:6px;border:1px solid #ccc;">
      <option value="">All Types</option>
      <option value="BOL">BOL</option>
      <option value="Receipt">Receipt</option>
      <option value="Other">Other</option>
    </select>
    <button id="selectVisibleBtn" style="padding:10px 16px;font-size:14px;border-radius:6px;border:1px solid #ccc;background:#eee;cursor:pointer;">✅ Select Visible</button>
    <button id="printBtn" style="padding:10px 16px;font-size:14px;border-radius:6px;border:none;background:#1a73e8;color:white;cursor:pointer;">🖨️ Print Selected</button>
    <button id="archiveBtn" style="padding:10px 16px;font-size:14px;border-radius:6px;border:1px solid #ccc;background:#eee;cursor:pointer;">🗄️ Archive Selected</button>
    <button id="deleteBtn" style="padding:10px 16px;font-size:14px;border-radius:6px;border:1px solid #e0a0a0;background:#fdecea;color:#c0392b;cursor:pointer;">🗑️ Delete Selected</button>
    <label style="font-size:14px;display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="showArchivedToggle"> Show archived
    </label>
    <span id="status" style="color:#666;"></span>
  </div>

  <table id="photoTable" style="border-collapse:collapse;width:100%;max-width:900px;background:white;box-shadow:0 1px 4px rgba(0,0,0,0.1);border-radius:8px;">
    <thead>
      <tr>
        <th style="text-align:center;padding:14px 18px;background:#f0f0f0;font-weight:600;font-size:12px;text-transform:uppercase;color:#555;width:36px;">
          <input type="checkbox" id="selectAllCheckbox">
        </th>
        <th style="text-align:left;padding:14px 18px;background:#f0f0f0;font-weight:600;font-size:12px;text-transform:uppercase;color:#555;">Job #</th>
        <th style="text-align:left;padding:14px 18px;background:#f0f0f0;font-weight:600;font-size:12px;text-transform:uppercase;color:#555;">Type</th>
        <th style="text-align:left;padding:14px 18px;background:#f0f0f0;font-weight:600;font-size:12px;text-transform:uppercase;color:#555;">Date</th>
        <th style="text-align:left;padding:14px 18px;background:#f0f0f0;font-weight:600;font-size:12px;text-transform:uppercase;color:#555;">Vehicle</th>
        <th style="text-align:left;padding:14px 18px;background:#f0f0f0;font-weight:600;font-size:12px;text-transform:uppercase;color:#555;">Driver</th>
        <th style="text-align:left;padding:14px 18px;background:#f0f0f0;font-weight:600;font-size:12px;text-transform:uppercase;color:#555;width:80px;">Photo</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div id="printArea" style="display:none;"></div>

  <script>
    var SOLUTION_ID = "aZmY0NmZkYWItOGYzZC1hNj";
    var MAX_NAME_LENGTH = 128; // Geotab's hard cap on entity Name fields

    var geotabApi = null;
    var sessionInfo = null;
    var deviceNameCache = {};
    var driverNameCache = {};
    var currentRecords = [];

    function main() {
      document.getElementById('refreshBtn').addEventListener('click', loadPhotos);
      document.getElementById('dateFilter').addEventListener('change', loadPhotos);
      document.getElementById('jobFilter').addEventListener('input', renderFilteredTable);
      document.getElementById('typeFilter').addEventListener('change', renderFilteredTable);
      document.getElementById('selectAllCheckbox').addEventListener('change', function () {
        setAllVisibleChecked(this.checked);
      });
      document.getElementById('selectVisibleBtn').addEventListener('click', function () {
        setAllVisibleChecked(true);
        document.getElementById('selectAllCheckbox').checked = true;
      });
      document.getElementById('printBtn').addEventListener('click', printSelected);
      document.getElementById('archiveBtn').addEventListener('click', archiveSelected);
      document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
      document.getElementById('showArchivedToggle').addEventListener('change', function () {
        var showArchived = this.checked;
        document.getElementById('archiveBtn').textContent = showArchived ? '↩️ Unarchive Selected' : '🗄️ Archive Selected';
        renderFilteredTable();
      });
      loadPhotos();
    }

    function setAllVisibleChecked(checked) {
      document.querySelectorAll('#tableBody input[type=checkbox]').forEach(function (cb) {
        cb.checked = checked;
      });
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    // Job # and Type were encoded into the filename at upload time, e.g.
    // "job-4521-type-BOL-1699999999.jpg". Older photos (before Type existed)
    // used "job-4521-1699999999.jpg" — still parsed correctly, just with no type.
    function parseFileName(name) {
      if (!name) return { job: '(none)', type: '(none)' };
      var withType = name.match(/^job-(.+)-type-(BOL|Receipt|Other)-\d+(?:-ARCHIVED)?\.[a-z]+$/i);
      if (withType) return { job: withType[1], type: withType[2] };
      var withoutType = name.match(/^job-(.+)-\d+(?:-ARCHIVED)?\.[a-z]+$/i);
      if (withoutType) return { job: withoutType[1], type: '(none)' };
      return { job: '(none)', type: '(none)' };
    }

    function extractJobNumber(name) {
      return parseFileName(name).job;
    }

    function isArchived(name) {
      return !!(name && /-ARCHIVED\.[a-z]+$/i.test(name));
    }

    // Builds the archived/unarchived version of a name while guaranteeing
    // the result never exceeds Geotab's 128-character Name cap AND can
    // never collide with another record's name. Archiving only ever
    // *adds* "-ARCHIVED" (9 chars) — for names already near the limit,
    // room has to be made by trimming.
    //
    // Trimming is made collision-proof by appending a short slice of the
    // record's own unique ID whenever trimming happens. Trying to instead
    // parse out and preserve the timestamp portion of the original name
    // is fragile — any record whose name doesn't match the exact expected
    // pattern falls back to a blind end-trim, which can strip the one
    // part that made it unique. The record ID is guaranteed unique by
    // Geotab itself, so basing the disambiguator on it removes that risk
    // entirely, regardless of how the original name was structured.
    function toggleArchiveName(name, id, archiving) {
      var extMatch = name.match(/(\.[a-z]+)$/i);
      var ext = extMatch ? extMatch[1] : '';
      var base = ext ? name.slice(0, name.length - ext.length) : name;
      var cleanBase = base.replace(/-ARCHIVED$/i, '');

      if (!archiving) {
        return cleanBase + ext;
      }

      var suffix = '-ARCHIVED';
      var fullWithSuffix = cleanBase + suffix + ext;
      if (fullWithSuffix.length <= MAX_NAME_LENGTH) {
        return fullWithSuffix;
      }

      var uid = (id || '').replace(/[^a-zA-Z0-9]/g, '').slice(-6);
      var disambiguator = uid ? '-' + uid : '';
      var maxBaseLength = MAX_NAME_LENGTH - suffix.length - ext.length - disambiguator.length;
      if (maxBaseLength < 0) maxBaseLength = 0;
      var trimmedBase = cleanBase.substring(0, maxBaseLength);
      return trimmedBase + disambiguator + suffix + ext;
    }

    function loadPhotos() {
      setStatus('Loading...');
      document.getElementById('tableBody').innerHTML = '';

      var search = { solutionId: SOLUTION_ID };
      var dateVal = document.getElementById('dateFilter').value;
      if (dateVal) {
        search.fromDate = new Date(dateVal + 'T00:00:00').toISOString();
        search.toDate = new Date(dateVal + 'T23:59:59').toISOString();
      }

      geotabApi.call('Get', {
        typeName: 'MediaFile',
        search: search
      }, function (records) {
        currentRecords = records || [];
        if (!currentRecords.length) {
          setStatus('No photos found.');
          return;
        }
        setStatus(currentRecords.length + ' photo(s) found.');
        resolveNames(currentRecords);
      }, function (err) {
        setStatus('Error loading photos: ' + err);
      });
    }

    function resolveNames(records) {
      var deviceIds = [];
      var driverIds = [];
      records.forEach(function (r) {
        if (r.device && r.device.id && r.device.id !== 'NoDeviceId' && !deviceNameCache[r.device.id]) {
          deviceIds.push(r.device.id);
        }
        if (r.driver && r.driver.id && r.driver.id !== 'UnknownDriverId' && !driverNameCache[r.driver.id]) {
          driverIds.push(r.driver.id);
        }
      });

      var calls = [];
      deviceIds.forEach(function (id) { calls.push(['Get', { typeName: 'Device', search: { id: id } }]); });
      driverIds.forEach(function (id) { calls.push(['Get', { typeName: 'User', search: { id: id } }]); });

      if (calls.length === 0) {
        renderFilteredTable();
        return;
      }

      geotabApi.multiCall(calls, function (results) {
        var di = 0;
        deviceIds.forEach(function (id) {
          var res = results[di++];
          if (res && res[0]) deviceNameCache[id] = res[0].name;
        });
        driverIds.forEach(function (id) {
          var res = results[di++];
          if (res && res[0]) {
            var u = res[0];
            driverNameCache[id] = (u.firstName || '') + ' ' + (u.lastName || '');
          }
        });
        renderFilteredTable();
      }, function () {
        renderFilteredTable();
      });
    }

    function renderFilteredTable() {
      var filterText = document.getElementById('jobFilter').value.trim().toLowerCase();
      var typeFilter = document.getElementById('typeFilter').value;
      var showArchived = document.getElementById('showArchivedToggle').checked;
      var body = document.getElementById('tableBody');
      body.innerHTML = '';
      document.getElementById('selectAllCheckbox').checked = false;

      currentRecords.forEach(function (r) {
        var archived = isArchived(r.name);
        if (archived !== showArchived) return;

        var parsed = parseFileName(r.name);
        var jobNumber = parsed.job;
        var photoType = parsed.type;

        if (filterText && jobNumber.toLowerCase().indexOf(filterText) === -1) return;
        if (typeFilter && photoType !== typeFilter) return;

        var deviceName = (r.device && r.device.id && deviceNameCache[r.device.id]) || 'Unassigned';
        var driverName = (r.driver && r.driver.id && driverNameCache[r.driver.id]) || 'Unassigned';
        var dateStr = r.fromDate ? new Date(r.fromDate).toLocaleString() : 'Unknown date';

        var tr = document.createElement('tr');
        tr.style.cssText = 'border-bottom:1px solid #eee;';
        if (body.children.length % 2 === 1) {
          tr.style.background = '#fafafa';
        }

        var checkTd = document.createElement('td');
        checkTd.style.cssText = 'padding:14px 18px;text-align:center;width:36px;';
        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.id = r.id;
        checkTd.appendChild(checkbox);
        tr.appendChild(checkTd);

        [jobNumber, photoType, dateStr, deviceName, driverName].forEach(function (val) {
          var td = document.createElement('td');
          td.style.cssText = 'padding:14px 18px;font-size:14px;';
          td.textContent = val;
          tr.appendChild(td);
        });

        var viewTd = document.createElement('td');
        viewTd.style.cssText = 'padding:14px 18px;width:80px;';
        var viewBtn = document.createElement('button');
        viewBtn.style.cssText = 'color:#1a73e8;cursor:pointer;text-decoration:underline;background:none;border:none;font-size:14px;padding:0;';
        viewBtn.textContent = 'View';
        viewBtn.addEventListener('click', function () {
          viewPhoto(r.id);
        });
        viewTd.appendChild(viewBtn);
        tr.appendChild(viewTd);

        body.appendChild(tr);
      });
    }

    // Opens a blank tab synchronously (so it isn't blocked as a popup),
    // then fills it in once the image has actually downloaded.
    function viewPhoto(mediaFileId) {
      var newTab = window.open('', '_blank');
      if (newTab) newTab.document.write('Loading photo...');
      downloadImageBlob(mediaFileId, function (blob) {
        var url = URL.createObjectURL(blob);
        if (newTab) newTab.location.href = url;
      }, function (err) {
        if (newTab) newTab.document.write('Failed to load photo: ' + err);
      });
    }

    function downloadImageBlob(mediaFileId, onSuccess, onError) {
      function send() {
        var payload = {
          method: 'DownloadMediaFile',
          params: {
            mediaFile: { id: mediaFileId },
            credentials: {
              database: sessionInfo.database,
              sessionId: sessionInfo.sessionId,
              userName: sessionInfo.userName
            }
          }
        };

        fetch('https://' + sessionInfo.server + '/apiv1/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (res) {
            var contentType = res.headers.get('content-type') || '';
            if (contentType.indexOf('json') !== -1) {
              return res.text().then(function (text) { throw new Error(text); });
            }
            return res.blob();
          })
          .then(onSuccess)
          .catch(function (err) { onError(err.message || String(err)); });
      }

      if (sessionInfo) {
        send();
      } else {
        fetchSession(send);
      }
    }

    function archiveSelected() {
      var checked = Array.prototype.slice.call(
        document.querySelectorAll('#tableBody input[type=checkbox]:checked')
      );
      if (!checked.length) {
        alert('Check at least one row first.');
        return;
      }

      var showArchived = document.getElementById('showArchivedToggle').checked;
      var archiving = !showArchived;
      var actionLabel = archiving ? 'Archiving' : 'Unarchiving';
      setStatus(actionLabel + ' ' + checked.length + ' photo(s)...');

      var calls = checked.map(function (cb) {
        var record = currentRecords.filter(function (r) { return r.id === cb.dataset.id; })[0];
        if (!record) return null;

        var newName = toggleArchiveName(record.name, record.id, archiving);
        var updatedEntity = Object.assign({}, record, { name: newName });
        return ['Set', { typeName: 'MediaFile', entity: updatedEntity }];
      }).filter(Boolean);

      geotabApi.multiCall(calls, function () {
        loadPhotos();
      }, function (err) {
        setStatus('Error updating photos: ' + err);
      });
    }

    function deleteSelected() {
      var checked = Array.prototype.slice.call(
        document.querySelectorAll('#tableBody input[type=checkbox]:checked')
      );
      if (!checked.length) {
        alert('Check at least one row first.');
        return;
      }

      var records = checked.map(function (cb) {
        return currentRecords.filter(function (r) { return r.id === cb.dataset.id; })[0];
      }).filter(Boolean);

      var preview = records.slice(0, 5).map(function (r) {
        return '• ' + extractJobNumber(r.name);
      }).join('\n');
      if (records.length > 5) {
        preview += '\n...and ' + (records.length - 5) + ' more';
      }

      var confirmed = confirm(
        'Permanently delete ' + records.length + ' photo(s)? This cannot be undone.\n\n' + preview
      );
      if (!confirmed) return;

      setStatus('Deleting ' + records.length + ' photo(s)...');

      var calls = records.map(function (r) {
        return ['Remove', { typeName: 'MediaFile', entity: { id: r.id } }];
      });

      geotabApi.multiCall(calls, function () {
        loadPhotos();
      }, function (err) {
        setStatus('Error deleting photos: ' + err);
      });
    }


      var checked = Array.prototype.slice.call(
        document.querySelectorAll('#tableBody input[type=checkbox]:checked')
      );
      if (!checked.length) {
        alert('Check at least one row to print.');
        return;
      }

      var printArea = document.getElementById('printArea');
      var cards = {};
      var index = 0;

      function updateProgress() {
        printArea.innerHTML = '<p>Loading photo ' + (index + 1) + ' of ' + checked.length + ' for print...</p>';
      }

      function processNext() {
        if (index >= checked.length) {
          finishPrint(checked, cards);
          return;
        }

        updateProgress();

        var cb = checked[index];
        var id = cb.dataset.id;
        var record = currentRecords.filter(function (r) { return r.id === id; })[0];
        if (!record) { index++; processNext(); return; }

        var parsed = parseFileName(record.name);
        var jobNumber = parsed.job;
        var photoType = parsed.type;
        var deviceName = (record.device && record.device.id && deviceNameCache[record.device.id]) || 'Unassigned';
        var driverName = (record.driver && record.driver.id && driverNameCache[record.driver.id]) || 'Unassigned';
        var dateStr = record.fromDate ? new Date(record.fromDate).toLocaleString() : 'Unknown date';

        // Builds the print card and waits for the image to actually finish
        // loading/decoding before calling back — setting img.src only
        // *starts* loading it asynchronously. Without this wait, whichever
        // photo happened to still be loading right when window.print() was
        // called (almost always the last one processed) would print blank,
        // since earlier photos had extra time to finish while later ones
        // were still being fetched.
        function buildCardAndWaitForLoad(blob, onReady) {
          var card = document.createElement('div');
          card.style.cssText = 'page-break-after:always;page-break-inside:avoid;text-align:center;padding-top:20px;';

          var img = document.createElement('img');
          img.style.cssText = 'max-width:90%;max-height:80vh;display:inline-block;';

          var settled = false;
          var safetyTimer;
          function settle() {
            if (settled) return;
            settled = true;
            clearTimeout(safetyTimer);
            onReady(card);
          }

          img.onload = settle;
          img.onerror = settle; // still show the card/stamp even if rendering the image itself fails
          safetyTimer = setTimeout(settle, 4000); // just in case neither event fires

          img.src = URL.createObjectURL(blob);

          var stampRow = document.createElement('div');
          stampRow.style.cssText = 'font-size:14px;margin-top:12px;';
          stampRow.textContent = 'Job #: ' + jobNumber + '  |  Type: ' + photoType + '  |  Date: ' + dateStr + '  |  Vehicle: ' + deviceName + '  |  Driver: ' + driverName;

          card.appendChild(img);
          card.appendChild(stampRow);
        }

        function attempt(retriesLeft) {
          downloadImageBlob(id, function (blob) {
            buildCardAndWaitForLoad(blob, function (card) {
              cards[id] = card;
              index++;
              processNext();
            });
          }, function (err) {
            // Fetching photos one at a time (not all at once) already
            // avoids the overload that caused occasional dropped
            // responses — this retry is just a safety net on top of that.
            if (retriesLeft > 0) {
              attempt(retriesLeft - 1);
            } else {
              var card = document.createElement('div');
              card.style.cssText = 'page-break-after:always;';
              card.textContent = 'Job #: ' + jobNumber + ' — photo failed to load after retrying (' + err + ')';
              cards[id] = card;
              index++;
              processNext();
            }
          });
        }

        attempt(1);
      }

      processNext();
    }

    function finishPrint(checked, cards) {
      var printArea = document.getElementById('printArea');
      printArea.innerHTML = '';
      checked.forEach(function (cb, i) {
        var card = cards[cb.dataset.id];
        if (!card) return;
        if (i === checked.length - 1) {
          card.style.pageBreakAfter = 'auto';
        }
        printArea.appendChild(card);
      });

      // Don't rely on @media print CSS (it may not survive however
      // MyGeotab embeds this page) — explicitly hide/show elements
      // around the print call instead.
      var toolbar = document.getElementById('toolbar');
      var table = document.getElementById('photoTable');
      var prevToolbarDisplay = toolbar.style.display;
      var prevTableDisplay = table.style.display;

      toolbar.style.display = 'none';
      table.style.display = 'none';
      printArea.style.display = 'block';

      window.print();

      toolbar.style.display = prevToolbarDisplay;
      table.style.display = prevTableDisplay;
      printArea.style.display = 'none';
    }

    function fetchSession(onReady) {
      geotabApi.getSession(function (session) {
        sessionInfo = {
          database: session.database,
          sessionId: session.sessionId,
          userName: session.userName,
          server: session.server || session.path || window.location.hostname
        };
        if (onReady) onReady();
      });
    }

    geotab.addin.fleetWolfPhotoGallery = function () {
      return {
        initialize: function (api, state, callback) {
          geotabApi = api;
          callback();
          fetchSession(function () {
            main();
          });
        },
        focus: function (api, state) {
          loadPhotos();
        },
        blur: function () {}
      };
    };
  </script>
</body>
</html>
